<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Zoom Notify</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: system-ui, sans-serif;
			background: #1e1e2e;
			color: #e0e0e0;
			width: 100vw;
			height: 100vh;
			display: flex;
			align-items: center;
			gap: 0.75rem;
			padding: 0.75rem 1rem;
			overflow: hidden;
			opacity: 1;
			transition: opacity 0.4s ease;
		}

		body.fade-out {
			opacity: 0;
		}

		#icon {
			width: 36px;
			height: 36px;
			flex-shrink: 0;
		}

		#content {
			flex: 1;
			overflow: hidden;
		}

		#sender {
			font-size: 0.85rem;
			font-weight: 600;
			color: #a0b4ff;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		#text {
			font-size: 0.8rem;
			color: #c0c0d0;
			margin-top: 0.15rem;
			display: -webkit-box;
			line-clamp: 2;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}

		#progress {
			position: fixed;
			bottom: 0;
			left: 0;
			height: 3px;
			background: #3344aa;
			width: 100%;
			transform-origin: left;
			animation: shrink 5s linear forwards;
		}

		@keyframes shrink {
			from { transform: scaleX(1); }
			to   { transform: scaleX(0); }
		}
	</style>
</head>

<body>
	<img id="icon" src="icon.png">
	<div id="content">
		<div id="sender"></div>
		<div id="text"></div>
	</div>
	<div id="progress"></div>

	<script src="notification.js"></script>
</body>

</html>
